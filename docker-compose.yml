# Levanta MySQL y MongoDB con:  docker compose up -d
# Las credenciales se leen del archivo .env de la raíz (ver .env.example).

services:
  mysql:
    build: .
    image: ds-mysql
    container_name: ds-mysql
    env_file: .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ds_mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: ds-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Define MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ds_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: ds-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ciencia_datos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  ds_mysql_data:
    name: ds_mysql_data
  ds_mongo_data:
    name: ds_mongo_data
  ds_postgres_data:
    name: ds_postgres_data
